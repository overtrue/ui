name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["22.18.0", "24"]
    env:
      REGISTRY_ORIGIN: https://ui.overtrue.xyz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate registry, typecheck, and build
        run: pnpm build
      - name: Validate registry and content
        run: |
          node scripts/registry/verify.mjs
          pnpm usage:check
          pnpm content:check
          git diff --exit-code
      - name: Package browser test build
        if: matrix.node == '24'
        run: tar -czf "$RUNNER_TEMP/site-build.tar.gz" dist src/blocks/catalog.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.node == '24'
        with:
          name: site-build
          path: ${{ runner.temp }}/site-build.tar.gz
          retention-days: 7
          if-no-files-found: error

  browser:
    name: Browser (${{ matrix.suite }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite:
          [
            site,
            components,
            compositions,
            workspace-desktop,
            workspace-mobile,
            workspace-interactions,
            visual-regressions,
          ]
    env:
      SITE_URL: http://127.0.0.1:4175
      PREVIEW_URL: http://127.0.0.1:4175/workspace/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-build
          path: ${{ runner.temp }}
      - run: tar -xzf "$RUNNER_TEMP/site-build.tar.gz"
      - run: pnpm exec playwright-cli install-browser chrome --with-deps
      - name: Start production preview
        run: |
          mkdir -p output
          pnpm exec vite preview --host 127.0.0.1 --port 4175 --strictPort > output/preview.log 2>&1 &
          echo $! > "$RUNNER_TEMP/preview.pid"
          for attempt in {1..60}; do
            if curl --fail --silent "$SITE_URL/" > /dev/null; then exit 0; fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/preview.pid")" 2>/dev/null; then break; fi
            echo "Waiting for preview ($attempt/60)"
            sleep 1
          done
          cat output/preview.log
          exit 1
      - name: Verify browser behavior
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          case "$SUITE" in
            site) node scripts/site/verify.mjs && pnpm home:check ;;
            components) pnpm site:check && pnpm catalog:check && node scripts/registry/verify-table-browser.mjs ;;
            compositions) node scripts/registry/verify-compositions.mjs ;;
            workspace-desktop)
              node scripts/examples/verify-workspace.mjs
              node scripts/examples/verify-polish.mjs --dark
              ;;
            workspace-mobile)
              node scripts/examples/verify-workspace.mjs --mobile
              node scripts/examples/verify-polish.mjs --dark --mobile
              ;;
            workspace-interactions) node scripts/examples/verify-interactions.mjs ;;
            visual-regressions) node scripts/examples/verify-polish-interactions.mjs ;;
            *) echo "Unknown suite: $SUITE"; exit 1 ;;
          esac
      - name: Stop preview server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/preview.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/preview.pid")" 2>/dev/null || true
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: browser-${{ matrix.suite }}
          path: output/
          retention-days: 7
          if-no-files-found: warn

  checks:
    name: CI checks
    if: always()
    needs: [build, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all build and browser jobs to pass
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$BUILD_RESULT" = success && test "$BROWSER_RESULT" = success
